name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:types
      - run: npm run test:coverage

  pack-and-dogfood:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:types
      - name: Check npm pack contents
        run: npm pack --dry-run
      - name: Smoke test packed tarball in clean directory
        run: |
          tarball=$(npm pack --silent)
          tmp=$(mktemp -d)
          cp "$tarball" "$tmp/"
          cd "$tmp"
          npm init -y >/dev/null
          npm install "./$tarball" --no-audit --no-fund
          ./node_modules/.bin/lockmatrix --version
          ./node_modules/.bin/lockmatrix --help >/dev/null
          rm -rf "$tmp" "$tarball"
      - name: Dogfood lockmatrix on own package-lock.json
        run: node bin/lockmatrix.js .
